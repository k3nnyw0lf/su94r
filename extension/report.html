<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glucose report · su94r Mini</title>
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <div class="toolbar">
    <label>Person <select id="who"></select></label>
    <label>Period <select id="days">
      <option value="14">14 days</option>
      <option value="30">30 days</option>
      <option value="90">90 days</option>
    </select></label>
    <span class="actions">
      <button id="pdf" type="button">Download PDF</button>
      <button id="drive" type="button" class="ghost">Save PDF to Drive</button>
      <button id="telegram" type="button" class="ghost">Send PDF to Telegram</button>
      <button id="print" type="button" class="ghost">Print</button>
    </span>
    <span id="status" class="muted small" role="status"></span>
  </div>
  <main id="report" class="report"><p>Loading…</p></main>
  <script type="module" src="report.js"></script>
</body>
</html>
